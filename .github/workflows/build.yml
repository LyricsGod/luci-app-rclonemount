name: Build packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认的 GITHUB_TOKEN 是只读的，发布 Release 会 401，必须显式给写权限
permissions:
  contents: write

jobs:
  # ---------------- ipk：opkg 格式（24.10 及更早） ----------------
  build-ipk:
    name: ipk (opkg 格式)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 推导版本号
        id: ver
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="1.1.0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "版本号: $VER"

      - name: 构建 ipk
        run: |
          chmod +x build-ipk.sh
          PKG_VERSION="${{ steps.ver.outputs.version }}" sh build-ipk.sh

      - name: 校验包结构
        run: |
          for f in build/*.ipk; do
            echo "=== $f ==="
            tar tzf "$f" | sort
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-rclonemount-ipk
          path: build/*.ipk
          if-no-files-found: error

  # ---------------- apk：APK 格式（24.10+ / 25.x 默认） ----------------
  build-apk:
    name: apk (APK 格式)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 同步版本号到 APKBUILD
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="1.1.0"
          fi
          sed -i "s/^pkgver=.*/pkgver=\"$VER\"/" apk/APKBUILD
          grep -E '^(pkgname|pkgver|pkgrel|arch)' apk/APKBUILD

      - name: 用 abuild 构建（Alpine 容器，保证包格式标准）
        uses: docker://alpine:3.21
        with:
          entrypoint: /bin/sh
          args: -c "sh /github/workspace/.github/build-apk.sh"

      - name: 校验 apk 可被 apk-tools 解析
        uses: docker://alpine:3.21
        with:
          entrypoint: /bin/sh
          args: >-
            -c "ls -lh apk/packages/noarch/ &&
            apk info --allow-untrusted apk/packages/noarch/*.apk"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-rclonemount-apk
          path: apk/packages/noarch/*.apk
          if-no-files-found: error

  # ---------------- 发布：两种格式一起挂到 Release ----------------
  release:
    name: 发布 Release
    needs: [build-ipk, build-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 收集产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出文件
        run: ls -lh artifacts

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
